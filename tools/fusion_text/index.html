<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fusión de Texto | Eduardo Workspace</title>

    <!-- 1. PRE-CARGA INMEDIATA DEL TEMA EN CACHÉ (EVITA DESTELLO BLANCO) -->
    <script>
        (function () {
            try {
                const cachedTheme = localStorage.getItem('eduardo_workspace_theme') ||
                    localStorage.getItem('artivo-admin-theme') ||
                    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                if (cachedTheme === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) { }
        })();
    </script>

    <!-- Fuentes para la Previsualización (Originales) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto&family=Open+Sans&family=Lato&family=Montserrat&family=Oswald&family=Raleway&family=Merriweather&family=Nunito&family=Ubuntu&family=PT+Sans&family=Source+Sans+Pro&family=Playfair+Display&family=Rubik&family=Work+Sans&family=Quicksand&family=Anton&family=Poppins&family=Fira+Sans&family=Roboto+Slab&family=Josefin+Sans&family=Comfortaa&family=Exo+2&family=Cairo&family=Karla&family=Mukta&family=Inconsolata&family=Zilla+Slab&family=Indie+Flower&family=Arvo&family=Pacifico&family=Dancing+Script&family=Catamaran&family=Varela+Round&family=Hind&family=Acme&family=Signika&family=Asap&family=Orbitron&family=Cabin&family=Manrope&family=Chivo&family=Archivo&family=Hind+Siliguri&family=Crete+Round&family=Concert+One&family=Heebo&family=Amatic+SC&family=Great+Vibes&display=swap"
        rel="stylesheet">

    <!-- Iconos y Fuente Principal Poppins -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Librerías PDF -->
    <!-- Librerías locales offline -->
    <script src="../../lib/pdf-lib.min.js"></script>
    <script src="../../lib/fontkit.umd.min.js"></script>
    <script src="../../lib/pdf.min.js"></script>
    <!-- Mapas de Fuentes locales -->
    <script src="fontmap.js"></script>

    <style>
        @font-face {
            font-family: 'Akira';
            src: url('../../assets/fonts/Akira Expanded.otf') format('opentype');
            font-weight: normal;
        }

        /* =========================================
           VARIABLES DE AURO STUDIO (MODO CLARO)
           ========================================= */
        :root {
            --primary: #6F8A3C;
            --primary-hover: #58702f;
            --primary-light: #f2f5eb;
            --border-focus: #6F8A3C;

            --bg-color: #f4f6f4;
            --bg-overlay: rgba(244, 246, 244, 0);
            --surface: #ffffff;
            --toolbar-bg: #fafbfa;
            --input-bg: #ffffff;
            --banner-bg: rgba(255, 255, 255, 0.95);
            --banner-border: rgba(255, 255, 255, 0.6);
            --card-border: #e2e8f0;

            --mat-bg: #e9ece9;
            --mat-line: rgba(111, 138, 60, 0.07);
            --mat-dot: #cbd5e0;

            --text-main: #2d3748;
            --text-muted: #718096;
            --border: #e2e8f0;
            --danger: #e53e3e;
            --danger-hover: #c53030;
            --danger-light: #fff5f5;

            --switch-bg: #e2e8f0;
            --switch-knob: #ffffff;

            --radius-xl: 20px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            --transition: all 0.22s ease;
        }

        /* =========================================
           VARIABLES MODO OSCURO
           ========================================= */
        [data-theme="dark"] {
            --primary: #84a348;
            --primary-hover: #96b559;
            --primary-light: rgba(132, 163, 72, 0.16);
            --border-focus: #84a348;

            --bg-color: #0f1419;
            --bg-overlay: rgba(15, 20, 25, 0.88);
            --surface: #182026;
            --toolbar-bg: #141b20;
            --input-bg: #11171c;
            --banner-bg: rgba(24, 32, 38, 0.92);
            --banner-border: rgba(255, 255, 255, 0.07);
            --card-border: #283540;

            --mat-bg: #12181d;
            --mat-line: rgba(132, 163, 72, 0.07);
            --mat-dot: #26323d;

            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #283540;
            --danger: #fc8181;
            --danger-hover: #f56565;
            --danger-light: rgba(229, 62, 62, 0.15);

            --switch-bg: #283540;
            --switch-knob: #84a348;

            --shadow-sm: 0 4px 10px -1px rgba(0, 0, 0, 0.35);
            --shadow-md: 0 12px 28px -5px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: url('../../assets/auro/bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 14px 20px;
            position: relative;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: var(--bg-overlay);
            pointer-events: none;
            z-index: 0;
            transition: background 0.3s ease;
        }

        body:not(.auth-verified) .container {
            display: none !important;
        }

        .security-check-loader {
            position: fixed;
            inset: 0;
            z-index: 5000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 0.86rem;
            font-weight: 600;
        }

        body.auth-verified .security-check-loader {
            display: none !important;
        }

        .security-spinner {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            animation: spinGuard 0.75s linear infinite;
        }

        @keyframes spinGuard {
            to {
                transform: rotate(360deg);
            }
        }

        input,
        select,
        textarea {
            -webkit-user-select: auto;
            -moz-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
        }

        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.03);
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 8px;
        }

        [data-theme="dark"] ::-webkit-scrollbar-thumb {
            background: #334155;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        .container {
            width: 100%;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        /* =========================================
           SWITCH DE MODO OSCURO
           ========================================= */
        .theme-switch {
            position: relative;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            width: 60px;
            height: 32px;
            flex-shrink: 0;
            margin: 0;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }

        .switch-slider {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: var(--switch-bg);
            border-radius: 50px;
            border: 1.5px solid var(--border);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.08);
        }

        .switch-slider .icon-sun {
            color: #f59e0b;
            font-size: 12px;
            transition: var(--transition);
            z-index: 1;
        }

        .switch-slider .icon-moon {
            color: #94a3b8;
            font-size: 12px;
            transition: var(--transition);
            z-index: 1;
        }

        [data-theme="dark"] .switch-slider .icon-moon {
            color: #ffffff;
        }

        .switch-knob {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 23px;
            height: 23px;
            background-color: var(--switch-knob);
            border-radius: 50%;
            transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            z-index: 2;
        }

        .theme-switch input:checked+.switch-slider .switch-knob {
            transform: translateX(27px);
        }

        .theme-switch:hover .switch-slider {
            border-color: var(--primary);
        }

        /* =========================================
           CABECERA SUPERIOR
           ========================================= */
        .top-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--banner-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 11px 22px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--banner-border);
            margin-bottom: 14px;
            flex-shrink: 0;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .nav-pill-btn {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.82rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 13px;
            border-radius: var(--radius-sm);
            background: var(--input-bg);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
        }

        .nav-pill-btn:hover {
            color: var(--primary);
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .header-title h1 {
            color: var(--primary);
            font-size: 1.12rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
        }

        .header-title p {
            color: var(--text-muted);
            font-size: 0.74rem;
            margin: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary-light);
            color: var(--primary);
            border: 1px solid rgba(111, 138, 60, 0.3);
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* =========================================
           ZONA DE CARGA INICIAL (MASIVA)
           ========================================= */
        .file-upload.massive-drop {
            border: 2px dashed var(--border);
            background: var(--surface);
            padding: 80px 20px;
            border-radius: var(--radius-xl);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-align: center;
            box-shadow: var(--shadow-md);
            margin: auto;
            max-width: 850px;
            width: 100%;
        }

        .file-upload.massive-drop:hover,
        .file-upload.massive-drop.dragover {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .file-upload.massive-drop i {
            color: var(--primary);
            font-size: 60px;
        }

        .file-upload.massive-drop span {
            font-weight: 600;
            color: var(--text-main);
            font-size: 1.2rem;
        }

        /* =========================================
           ESTACIÓN PRINCIPAL (3 COLUMNAS)
           ========================================= */
        #editorSection {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .main-grid {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 320px 1fr 340px;
            gap: 16px;
            width: 100%;
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            width: 100%;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .col-config {
            order: 1;
        }

        .col-results {
            order: 2;
        }

        .col-inputs {
            order: 3;
        }

        .panel-header-bar {
            padding: 11px 18px;
            border-bottom: 1px solid var(--border);
            background: var(--toolbar-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            gap: 10px;
        }

        .panel-header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .panel-header-title i {
            color: var(--primary);
        }

        .panel-scroll-body {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 0;
        }

        /* ZONA DE PREVISUALIZACIÓN PDF */
        .panel-scroll-body.pdf-zone {
            background-color: var(--mat-bg);
            background-image:
                linear-gradient(var(--mat-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--mat-line) 1px, transparent 1px),
                radial-gradient(var(--mat-dot) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px;
            align-items: center;
        }

        .pdf-preview-wrapper {
            position: relative;
            display: inline-block;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            background: white;
            max-width: 100%;
        }

        #pdfCanvas {
            display: block;
            max-width: 100%;
            height: auto;
        }

        /* TEXTO ARRASTRABLE */
        #textOverlay {
            position: absolute;
            cursor: grab;
            border: 1px dashed transparent;
            padding: 2px 4px;
            user-select: none;
            white-space: nowrap;
            transition: border 0.2s;
            line-height: 1;
        }

        #textOverlay:hover {
            border: 1px dashed var(--primary);
            background: rgba(111, 138, 60, 0.05);
        }

        #textOverlay:active {
            cursor: grabbing;
            border: 1px dashed var(--primary);
        }

        #textOverlay:focus {
            outline: none;
            border: 1px solid var(--primary);
            background: rgba(111, 138, 60, 0.1);
        }

        /* CONTROLES ESTILO AURO */
        .config-block {
            background: var(--toolbar-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 13px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        h2 {
            font-family: 'Akira', sans-serif;
            font-size: 0.78rem;
            font-weight: normal;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            letter-spacing: 0.5px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 8px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 0.84rem;
            font-weight: 500;
            transition: var(--transition);
            outline: none;
        }

        textarea {
            height: 180px;
            resize: none;
            font-size: 0.8rem;
        }

        select {
            cursor: pointer;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(111, 138, 60, 0.16);
        }

        input[type="color"] {
            border: 1px solid var(--border);
            width: 100%;
            height: 38px;
            border-radius: var(--radius-sm);
            padding: 2px;
            cursor: pointer;
            background: var(--input-bg);
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: var(--radius-sm);
        }

        /* RESUMEN / TARJETA FINAL */
        .summary-card {
            background: var(--toolbar-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            width: 100%;
            padding: 11px 18px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            font-size: 0.84rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(111, 138, 60, 0.24);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: var(--surface);
            color: var(--primary);
            border: 1.5px solid var(--primary);
        }

        .btn-outline:hover:not(:disabled) {
            background: var(--primary-light);
            transform: translateY(-1px);
        }

        /* NAVEGACIÓN MÓVIL (STEPPER) */
        .mobile-nav {
            display: none;
        }

        @media (max-width: 1023px) {
            body {
                height: auto;
                min-height: 100vh;
                overflow: auto;
                padding: 10px 12px;
            }

            .top-banner {
                padding: 10px 14px;
                margin-bottom: 12px;
            }

            .header-badge {
                display: none;
            }

            .main-grid {
                display: block;
            }

            .card {
                min-height: 460px;
            }

            .mobile-nav {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: 12px;
                padding: 10px 14px;
                background: var(--surface);
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow-sm);
                border: 1px solid var(--border);
            }

            .step-dots {
                display: flex;
                gap: 8px;
            }

            .step-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--border);
                transition: var(--transition);
            }

            .step-dot.active {
                background: var(--primary);
                transform: scale(1.3);
            }
        }
    </style>
</head>

<body>

    <div class="security-check-loader" id="securityLoader">
        <div class="security-spinner"></div>
        <span>Verificando permisos de acceso en Firebase...</span>
    </div>

    <div class="container">

        <!-- CABECERA AURO -->
        <header class="top-banner">
            <div class="header-left">
                <a href="../../index.html" class="nav-pill-btn"><i class="fas fa-arrow-left"></i> Portal</a>
                <div class="header-title">
                    <h1><i class="fa-solid fa-file-pdf"></i> <span>Fusión de Texto</span></h1>
                    <p>Generación de PDFs personalizados por lotes</p>
                </div>
            </div>

            <div class="header-right">
                <div class="header-badge"><i class="fas fa-bolt"></i><span>Procesamiento Local</span></div>

                <label class="theme-switch" title="Cambiar tema">
                    <input type="checkbox" class="theme-checkbox" id="themeToggleCheckbox">
                    <span class="switch-slider">
                        <i class="fas fa-sun icon-sun"></i>
                        <i class="fas fa-moon icon-moon"></i>
                        <span class="switch-knob"></span>
                    </span>
                </label>
            </div>
        </header>

        <!-- ZONA DE CARGA INICIAL (MASIVA) -->
        <label id="uploadArea" class="file-upload massive-drop">
            <i class="fas fa-cloud-upload-alt"></i>
            <span>Arrastra tu archivo PDF (Plantilla) aquí o haz clic para seleccionar</span>
            <input type="file" id="pdfInput" accept="application/pdf" hidden />
        </label>

        <!-- GRID 3 COLUMNAS AURO (Oculto hasta cargar archivos) -->
        <div id="editorSection" style="display: none;">
            <div class="main-grid">

                <!-- COLUMNA 1: CONFIGURACIÓN -->
                <div class="card col-config" id="col-config">
                    <div class="panel-header-bar">
                        <div class="panel-header-title">
                            <i class="fa-solid fa-sliders"></i>
                            <span>Ajustes de Texto</span>
                        </div>
                    </div>
                    <div class="panel-scroll-body">
                        <div class="config-block">
                            <h2><i class="fas fa-cogs"></i> Formato de Fuente</h2>

                            <div class="form-group">
                                <label><i class="fas fa-font"></i> Tipografía:</label>
                                <!-- Selector original conservado -->
                                <select id="fontSelect">
                                    <option value="Arial-Regular">Arial</option>
                                    <option class="font-BirthstoneRegular" value="Birthstone-Regular">Birthstone
                                    </option>
                                    <option class="font-CookieRegular" value="Cookie-Regular">Cookie Regular</option>
                                    <option class="font-DelaGothicOneRegular" value="DelaGothicOne-Regular">Dela Gothic
                                        One</option>

    <!-- =========================================================================
         LÓGICA VISTA MÓVIL STEPPER Y OBSERVER PARA EL CONTENEDOR
         ========================================================================= -->
    <script>
        let currentStep = 0;
        const columnsOrder = ['col-config', 'col-results', 'col-inputs'];

        window.addEventListener('resize', updateMobileView);

        function changeStep(dir) {
            currentStep += dir;
            if (currentStep < 0) currentStep = 0;
            if (currentStep > 2) currentStep = 2;
            updateMobileView();
        }

        function updateMobileView() {
            const isMobile = window.innerWidth <= 1023;
            const mobileNav = document.getElementById('mobileNav');
            const editorSection = document.getElementById('editorSection');

            // Solo mostrar stepper en móvil y si el contenedor principal está activo
            if (isMobile && editorSection.style.display !== 'none') {
                mobileNav.style.display = 'flex';
                columnsOrder.forEach((colId, index) => {
                    document.getElementById(colId).style.display = (index === currentStep) ? 'flex' : 'none';
                });
                document.querySelectorAll('.step-dot').forEach((dot, index) => {
                    dot.classList.toggle('active', index === currentStep);
                });
                document.getElementById('btnPrevMobile').style.visibility = currentStep === 0 ? 'hidden' : 'visible';
                document.getElementById('btnNextMobile').style.visibility = currentStep === columnsOrder.length - 1 ? 'hidden' : 'visible';
            } else {
                mobileNav.style.display = 'none';
                columnsOrder.forEach(colId => {
                    document.getElementById(colId).style.display = 'flex';
                });
            }
        }

        // Observar cuando fusion_text.js cambia el display de editorSection
        const observer = new MutationObserver(function (mutations) {
            mutations.forEach(function (mutation) {
                if (mutation.attributeName === "style") {
                    updateMobileView();
                }
            });
        });

        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('editorSection');
            if (container) {
                observer.observe(container, { attributes: true });
            }
            updateMobileView();
        });
    </script>

    <!-- =========================================================================
         LÓGICA DEL TEMA LOCALSTORAGE
         ========================================================================= -->
    <script>
        const THEME_STORAGE_KEY = "eduardo_workspace_theme";
        const ADMIN_THEME_KEY = "artivo-admin-theme";

        function getCachedTheme() {
            try {
                const stored = localStorage.getItem(THEME_STORAGE_KEY) || localStorage.getItem(ADMIN_THEME_KEY);
                if (stored === 'dark' || stored === 'light') return stored;
            } catch (e) { }
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme, saveToCache = true) {
            const isDark = theme === 'dark';
            if (isDark) { document.documentElement.setAttribute('data-theme', 'dark'); }
            else { document.documentElement.removeAttribute('data-theme'); }

            const checkbox = document.getElementById('themeToggleCheckbox');
            if (checkbox) checkbox.checked = isDark;

            if (saveToCache) {
                try {
                    const val = isDark ? 'dark' : 'light';
                    localStorage.setItem(THEME_STORAGE_KEY, val);
                    localStorage.setItem(ADMIN_THEME_KEY, val);
                } catch (e) { }
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            applyTheme(getCachedTheme(), true);
            const checkbox = document.getElementById('themeToggleCheckbox');
            if (checkbox) {
                checkbox.addEventListener('change', (e) => { applyTheme(e.target.checked ? 'dark' : 'light', true); });
            }
        });

        window.addEventListener('storage', (e) => {
            if (e.key === THEME_STORAGE_KEY || e.key === ADMIN_THEME_KEY) {
                if (e.newValue === 'dark' || e.newValue === 'light') { applyTheme(e.newValue, false); }
            }
        });
    </script>

    <!-- =========================================================================
         GUARDIÁN DE SEGURIDAD DE ALTO GRADO (FIREBASE AUTH + FIRESTORE EN VIVO)
         ========================================================================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, query, limit, getDocs, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // Asignamos el ID de Firebase de tu script auth-guard original para esta herramienta
        const REQUIRED_TOOL_ID = "pdf_merger";
        const LOGIN_URL = "../../index.html";

        // Si tienes las credenciales en un archivo separado `auth-guard.js`, expórtalas de ahí.
        // Asumo que están en `FIREBASE_CONFIG` como en los ejemplos anteriores.
        import { FIREBASE_CONFIG } from "../../js/auth-guard.js";

        function denyAndRedirect() {
            sessionStorage.removeItem('secure_app_token');
            sessionStorage.removeItem('artivo_session_user');
            window.location.replace(LOGIN_URL);
        }

        function unlockWorkspace() {
            document.body.classList.add('auth-verified');
            window.dispatchEvent(new Event('resize'));
        }

        const todayISO = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.includes("PEGA_AQUI")) {
            console.error("Falta configurar FIREBASE_CONFIG.");
            denyAndRedirect();
        } else {
            const app = initializeApp(FIREBASE_CONFIG);
            const auth = getAuth(app);
            const db = getFirestore(app);
            let unsubDoc = null;

            async function checkIsAdminByRule() {
                try { await getDocs(query(collection(db, "users"), limit(1))); return true; }
                catch (e) { return false; }
            }

            onAuthStateChanged(auth, async (user) => {
                if (unsubDoc) { unsubDoc(); unsubDoc = null; }
                if (!user || !user.email) { denyAndRedirect(); return; }

                const email = user.email.toLowerCase();
                const isAdmin = await checkIsAdminByRule();

                if (isAdmin) { unlockWorkspace(); return; }

                unsubDoc = onSnapshot(doc(db, "users", email), (snap) => {
                    if (!snap.exists()) { denyAndRedirect(); return; }
                    const userData = snap.data();
                    const isExpired = userData.state === 'active' && userData.expiry && userData.expiry < todayISO();

                    const hasToolPermission = Array.isArray(userData.tools) && userData.tools.includes(REQUIRED_TOOL_ID);

                    if (userData.state !== 'active' || isExpired || !hasToolPermission) { denyAndRedirect(); return; }
                    unlockWorkspace();
                }, () => { denyAndRedirect(); });
            });
        }
    </script>
