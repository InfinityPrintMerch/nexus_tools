    <style>
        /* VARIABLES DE AURO STUDIO */
        :root {
            --primary: #6F8A3C;
            --primary-hover: #58702f;
            --primary-light: #f2f5eb;
            --bg-color: #f4f6f4;
            --surface: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border: #e2e8f0;
            --radius-xl: 20px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            background-image: url('../../assets/auro/bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 20px auto;
            flex: 1;
        }

        /* NAVEGACIÓN */
        .back-nav {
            margin-bottom: 20px;
        }

        .back-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .back-nav a:hover {
            color: var(--primary);
        }

        /* BANNER SUPERIOR */
        .top-banner {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: var(--radius-xl);
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        .top-banner h1 {
            color: var(--primary);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .top-banner p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* ZONA DE DRAG & DROP */
        .file-upload {
            background: var(--surface);
            border: 2px dashed var(--border);
            padding: 60px 20px;
            border-radius: var(--radius-xl);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .file-upload.dragover,
        .file-upload:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .file-upload i {
            color: var(--primary);
            font-size: 45px;
        }

        .file-upload span {
            font-weight: 500;
            color: var(--text-main);
            font-size: 1.1rem;
        }

        /* CONTENEDOR DEL EDITOR */
        .editor-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        @media (min-width: 900px) {
            .editor-container {
                flex-direction: row;
                align-items: flex-start;
            }
        }

        /* ZONA DE PREVISUALIZACIÓN PDF */
        .preview-panel {
            flex: 1;
            background: var(--surface);
            border-radius: var(--radius-xl);
            padding: 20px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(0, 0, 0, 0.03);
            display: flex;
            justify-content: center;
            overflow: auto;
            position: relative;
        }

        .pdf-preview-wrapper {
            position: relative;
            display: inline-block;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            background: white;
        }

        #pdfCanvas {
            display: block;
        }

        /* TEXTO ARRASTRABLE */
        #textOverlay {
            position: absolute;
            cursor: grab;
            border: 1px dashed transparent;
            padding: 2px 4px;
            user-select: none;
            white-space: nowrap;
            transition: border 0.2s;
            line-height: 1;
        }

        #textOverlay:hover {
            border: 1px dashed var(--primary);
            background: rgba(111, 138, 60, 0.05);
        }

        #textOverlay:active {
            cursor: grabbing;
            border: 1px dashed var(--primary);
        }

        #textOverlay:focus {
            outline: none;
            border: 1px solid var(--primary);
            background: rgba(111, 138, 60, 0.1);
        }

        /* PANEL DE CONTROLES LATERAL */
        .controls-panel {
            width: 100%;
            max-width: 350px;
            background: var(--surface);
            border: 1px solid rgba(0, 0, 0, 0.03);
            border-radius: var(--radius-xl);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: var(--shadow-md);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--border);
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
            font-family: 'Poppins', sans-serif;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        select {
            cursor: pointer;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary);
        }

        /* Color Picker Personalizado */
        input[type="color"] {
            border: 1px solid var(--border);
            width: 100%;
            height: 48px;
            border-radius: var(--radius-md);
            padding: 2px;
            cursor: pointer;
            background: var(--bg-color);
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: var(--radius-sm);
        }

        /* BOTONES GLOBALES */
        .btn {
            width: 100%;
            padding: 14px 20px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(111, 138, 60, 0.2);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: var(--primary-light);
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-outline:hover:not(:disabled) {
            background: var(--primary);
            color: white;
        }
    </style>
</head>
