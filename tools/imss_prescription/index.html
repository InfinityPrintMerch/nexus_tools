<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generador de Prescripciones | Eduardo Workspace</title>

    <!-- 1. PRE-CARGA INMEDIATA DEL TEMA EN CACHÉ (EVITA DESTELLO BLANCO) -->
    <script>
        (function () {
            try {
                const cachedTheme = localStorage.getItem('eduardo_workspace_theme') ||
                    localStorage.getItem('artivo-admin-theme') ||
                    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                if (cachedTheme === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) { }
        })();
    </script>

    <!-- Librerías de PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit@0.0.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <!-- Importar datos desde archivo externo -->
    <script src="./datos.js"></script>

    <!-- Fuente Poppins e Iconos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @font-face {
            font-family: 'Akira';
            src: url('../../assets/fonts/Akira Expanded.otf') format('opentype');
            font-weight: normal;
        }

        /* =========================================
           VARIABLES DE AURO STUDIO (MODO CLARO)
           ========================================= */
        :root {
            --primary: #6F8A3C;
            --primary-hover: #58702f;
            --primary-light: #f2f5eb;
            --border-focus: #6F8A3C;

            --bg-color: #f4f6f4;
            --bg-overlay: rgba(244, 246, 244, 0);
            --surface: #ffffff;
            --toolbar-bg: #fafbfa;
            --input-bg: #ffffff;
            --banner-bg: rgba(255, 255, 255, 0.95);
            --banner-border: rgba(255, 255, 255, 0.6);
            --card-border: #e2e8f0;

            --text-main: #2d3748;
            --text-muted: #718096;
            --border: #e2e8f0;
            --danger: #e53e3e;
            --danger-hover: #c53030;
            --danger-light: #fff5f5;

            --switch-bg: #e2e8f0;
            --switch-knob: #ffffff;

            --radius-xl: 20px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            --transition: all 0.22s ease;
        }

        /* =========================================
           VARIABLES MODO OSCURO
           ========================================= */
        [data-theme="dark"] {
            --primary: #84a348;
            --primary-hover: #96b559;
            --primary-light: rgba(132, 163, 72, 0.16);
            --border-focus: #84a348;

            --bg-color: #0f1419;
            --bg-overlay: rgba(15, 20, 25, 0.88);
            --surface: #182026;
            --toolbar-bg: #141b20;
            --input-bg: #11171c;
            --banner-bg: rgba(24, 32, 38, 0.92);
            --banner-border: rgba(255, 255, 255, 0.07);
            --card-border: #283540;

            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #283540;
            --danger: #fc8181;
            --danger-hover: #f56565;
            --danger-light: rgba(229, 62, 62, 0.15);

            --switch-bg: #283540;
            --switch-knob: #84a348;

            --shadow-sm: 0 4px 10px -1px rgba(0, 0, 0, 0.35);
            --shadow-md: 0 12px 28px -5px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        /* BLOQUEO DE SELECCIÓN Y ESTACIÓN DE ALTURA COMPLETA */
        body {
            background-color: var(--bg-color);
            background-image: url('../../assets/auro/bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 14px 20px;
            position: relative;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: var(--bg-overlay);
            pointer-events: none;
            z-index: 0;
            transition: background 0.3s ease;
        }

        body:not(.auth-verified) .container {
            display: none !important;
        }

        .security-check-loader {
            position: fixed;
            inset: 0;
            z-index: 5000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 0.86rem;
            font-weight: 600;
        }

        body.auth-verified .security-check-loader {
            display: none !important;
        }

        .security-spinner {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            animation: spinGuard 0.75s linear infinite;
        }

        @keyframes spinGuard {
            to {
                transform: rotate(360deg);
            }
        }

        input,
        select,
        textarea {
            -webkit-user-select: auto;
            -moz-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
        }

        /* Scrollbars personalizados */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.03);
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 8px;
        }

        [data-theme="dark"] ::-webkit-scrollbar-thumb {
            background: #334155;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        .container {
            width: 100%;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        /* =========================================
           SWITCH DE MODO OSCURO
           ========================================= */
        .theme-switch {
            position: relative;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            width: 60px;
            height: 32px;
            flex-shrink: 0;
            margin: 0;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }

        .switch-slider {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: var(--switch-bg);
            border-radius: 50px;
            border: 1.5px solid var(--border);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.08);
        }

        .switch-slider .icon-sun {
            color: #f59e0b;
            font-size: 12px;
            transition: var(--transition);
            z-index: 1;
        }

        .switch-slider .icon-moon {
            color: #94a3b8;
            font-size: 12px;
            transition: var(--transition);
            z-index: 1;
        }

        [data-theme="dark"] .switch-slider .icon-moon {
            color: #ffffff;
        }

        .switch-knob {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 23px;
            height: 23px;
            background-color: var(--switch-knob);
            border-radius: 50%;
            transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            z-index: 2;
        }

        .theme-switch input:checked+.switch-slider .switch-knob {
            transform: translateX(27px);
        }

        .theme-switch:hover .switch-slider {
            border-color: var(--primary);
        }

        /* =========================================
           CABECERA SUPERIOR
           ========================================= */
        .top-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--banner-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 11px 22px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--banner-border);
            margin-bottom: 14px;
            flex-shrink: 0;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .nav-pill-btn {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.82rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 13px;
            border-radius: var(--radius-sm);
            background: var(--input-bg);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
        }

        .nav-pill-btn:hover {
            color: var(--primary);
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .header-title h1 {
            color: var(--primary);
            font-size: 1.12rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
        }

        .header-title p {
            color: var(--text-muted);
            font-size: 0.74rem;
            margin: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary-light);
            color: var(--primary);
            border: 1px solid rgba(111, 138, 60, 0.3);
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* =========================================
           ESTACIÓN PRINCIPAL (3 COLUMNAS)
           ========================================= */
        .main-grid {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 350px 1fr 380px;
            gap: 16px;
            width: 100%;
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            width: 100%;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .col-config {
            order: 1;
        }

        .col-results {
            order: 2;
        }

        .col-inputs {
            order: 3;
        }

        .panel-header-bar {
            padding: 11px 18px;
            border-bottom: 1px solid var(--border);
            background: var(--toolbar-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            gap: 10px;
        }

        .panel-header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .panel-header-title i {
            color: var(--primary);
        }

        .panel-scroll-body {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 0;
        }

        .config-block {
            background: var(--toolbar-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 13px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        h2 {
            font-family: 'Akira', sans-serif;
            font-size: 0.78rem;
            font-weight: normal;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            letter-spacing: 0.5px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        /* FORMULARIOS Y GRIDS (Adaptados a Auro) */
        .form-group {
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 8px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 0.84rem;
            font-weight: 500;
            transition: var(--transition);
            outline: none;
        }

        textarea {
            height: 90px;
            resize: none;
            font-size: 0.8rem;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(111, 138, 60, 0.16);
        }

        .auto-filled {
            background: var(--bg-color);
            color: var(--text-muted);
            font-family: monospace;
            font-size: 0.82rem;
        }

        /* RESUMEN / TARJETA FINAL */
        .summary-card {
            background: var(--toolbar-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 11px 18px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            font-size: 0.84rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(111, 138, 60, 0.24);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-outline-primary {
            background: var(--surface);
            color: var(--primary);
            border: 1.5px solid var(--primary);
        }

        .btn-outline-primary:hover:not(:disabled) {
            background: var(--primary-light);
            color: var(--primary-hover);
            transform: translateY(-1px);
        }

        /* NAVEGACIÓN MÓVIL (STEPPER) */
        .mobile-nav {
            display: none;
        }

        @media (max-width: 1023px) {
            body {
                height: auto;
                min-height: 100vh;
                overflow: auto;
                padding: 10px 12px;
            }

            .top-banner {
                padding: 10px 14px;
                margin-bottom: 12px;
            }

            .header-badge {
                display: none;
            }

            .main-grid {
                display: block;
            }

            .card {
                min-height: 460px;
            }

            .mobile-nav {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: 12px;
                padding: 10px 14px;
                background: var(--surface);
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow-sm);
                border: 1px solid var(--border);
            }

            .step-dots {
                display: flex;
                gap: 8px;
            }

            .step-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--border);
                transition: var(--transition);
            }

            .step-dot.active {
                background: var(--primary);
                transform: scale(1.3);
            }
        }
    </style>
</head>

<body>

    <div class="security-check-loader" id="securityLoader">
        <div class="security-spinner"></div>
        <span>Verificando permisos de acceso en Firebase...</span>
    </div>

    <div class="container">

        <!-- CABECERA AURO -->
        <header class="top-banner">
            <div class="header-left">
                <a href="../../index.html" class="nav-pill-btn"><i class="fas fa-arrow-left"></i> Portal</a>
                <div class="header-title">
                    <h1><i class="fa-solid fa-file-prescription"></i> <span>Prescripciones Pro</span></h1>
                    <p>Generación rápida, segura y automatizada</p>
                </div>
            </div>

            <div class="header-right">
                <div class="header-badge"><i class="fas fa-bolt"></i><span>Sistema Rápido</span></div>
                <label class="theme-switch" title="Cambiar tema">
                    <input type="checkbox" class="theme-checkbox" id="themeToggleCheckbox">
                    <span class="switch-slider">
                        <i class="fas fa-sun icon-sun"></i>
                        <i class="fas fa-moon icon-moon"></i>
                        <span class="switch-knob"></span>
                    </span>
                </label>
            </div>
        </header>

        <!-- GRID 3 COLUMNAS AURO -->
        <div class="main-grid">

            <!-- COLUMNA 1: CONFIGURACIÓN -->
            <div class="card col-config" id="col-config">
                <div class="panel-header-bar">
                    <div class="panel-header-title">
                        <i class="fa-solid fa-sliders"></i>
                        <span>Configuración de Consulta</span>
                    </div>
                </div>
                <div class="panel-scroll-body">
                    <div class="config-block">
                        <h2><i class="fas fa-user-md"></i> Parametros Iniciales</h2>
                        <div class="form-group">
                            <label>Médico Tratante</label>
                            <select id="sel_medico">
                                <option value="">Seleccionar Médico...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Unidad Médica</label>
                            <select id="sel_clinica">
                                <option value="">Seleccionar Clínica...</option>
                            </select>
                        </div>
                    </div>

                    <div class="config-block">
                        <h2><i class="fas fa-pills"></i> Tratamientos</h2>
                        <div class="form-group">
                            <label>Tratamiento 1 (Principal)</label>
                            <select id="sel_receta">
                                <option value="">Elegir tratamiento 1...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Tratamiento 2 (Opcional)</label>
                            <select id="sel_receta_secundaria">
                                <option value="">Ninguno (Opcional)...</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- COLUMNA 2: PACIENTE -->
            <div class="card col-results" id="col-results">
                <div class="panel-header-bar">
                    <div class="panel-header-title">
                        <i class="fa-solid fa-user-injured"></i>
                        <span>Datos del Paciente</span>
                    </div>
                </div>
                <div class="panel-scroll-body">
                    <div class="config-block">
                        <h2><i class="fas fa-id-card"></i> Información Personal</h2>
                        <div class="form-group">
                            <label>Nombre Completo</label>
                            <input type="text" id="in_nombre" placeholder="Nombre del paciente">
                        </div>
                        <div class="grid-2">
                            <div class="form-group"><label>NSS</label><input type="text" id="in_nss"
                                    placeholder="94058643357"></div>
                            <div class="form-group"><label>CURP</label><input type="text" id="in_curp"
                                    placeholder="Ingrese CURP"></div>
                        </div>
                        <div class="form-group"><label>Fecha de Nacimiento</label><input type="date" id="in_nacimiento">
                        </div>
                    </div>

                    <div class="config-block">
                        <h2><i class="fas fa-fingerprint"></i> Control Interno</h2>
                        <div class="grid-2">
                            <div class="form-group">
                                <label>A.MED (Autogenerado)</label>
                                <input type="text" id="in_amed" class="auto-filled" readonly
                                    placeholder="Calculando...">
                            </div>
                            <div class="form-group">
                                <label>Número de Folio</label>
                                <input type="text" id="in_folio" class="auto-filled" readonly
                                    placeholder="Generando...">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- COLUMNA 3: PRESCRIPCIÓN FINAL -->
            <div class="card col-inputs" id="col-inputs">
                <div class="panel-header-bar">
                    <div class="panel-header-title">
                        <i class="fa-solid fa-file-medical"></i>
                        <span>Detalles y Generación</span>
                    </div>
                </div>
                <div class="panel-scroll-body">
                    <div class="config-block">
                        <h2><i class="fas fa-notes-medical"></i> Detalle de Receta</h2>
                        <div class="grid-2">
                            <div class="form-group"><label>Consultorio</label><input type="text" id="in_consultorio"
                                    class="auto-filled" readonly></div>
                            <div class="form-group"><label>Turno</label><input type="text" id="in_turno"
                                    class="auto-filled" readonly></div>
                        </div>
                        <div class="grid-2">
                            <div class="form-group"><label>Fecha de Consulta</label><input type="date"
                                    id="in_fecha_selector"></div>
                            <div class="form-group"><label>Clave Presupuestal</label><input type="text" id="in_clave"
                                    class="auto-filled" readonly></div>
                        </div>
                        <div class="form-group">
                            <label>Prescripción y Posología</label>
                            <textarea id="in_prescripcion" class="auto-filled"
                                placeholder="La posología aparecerá aquí..."></textarea>
                        </div>
                    </div>

                    <!-- Reposo -->
                    <div class="config-block"
                        style="background: var(--primary-light); border-color: rgba(111, 138, 60, 0.2);">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <input type="checkbox" id="chk_reposo" style="width: 16px; height: 16px; cursor: pointer;">
                            <label for="chk_reposo"

        function generarAMED() {
            const nombre = document.getElementById('in_nombre').value.toUpperCase().replace(/[^A-Z]/g, '');
            const nss = document.getElementById('in_nss').value.replace(/[^0-9]/g, '');
            let p1 = nombre.length > 1 ? nombre.substring(0, 2) : "XX";
            let p2 = nss.length > 0 ? nss.substring(nss.length - 1) : "0";
            let p3 = Math.random().toString(36).substring(2, 4).toUpperCase();
            let p4 = Math.floor(Math.random() * 9) + 1;
            let p5 = Math.random().toString(36).substring(2, 4).toUpperCase();
            const amed = (p1 + p2 + p3 + p4 + p5).substring(0, 8);
            document.getElementById('in_amed').value = amed;
            return amed;
        }

        function generarFolio() {
            const base13 = Date.now().toString();
            const digitoExtra = Math.floor(Math.random() * 10).toString();
            const folio14 = base13 + digitoExtra;
            document.getElementById('in_folio').value = folio14;
            return folio14;
        }

        function formatearFechaPDF(fechaIso, formatoLargo = false) {
            if (!fechaIso) return "";
            const partes = fechaIso.split('-');
            const fecha = new Date(partes[0], partes[1] - 1, partes[2]);
            if (formatoLargo) {
                const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                return `${partes[2]} de ${meses[fecha.getMonth()]} ${partes[0]}`;
            } else {
                return `${partes[2]}/${partes[1]}/${partes[0]}`;
            }
        }

        function generarBarcodeBase64(texto) {
            const canvas = document.createElement('canvas');
            JsBarcode(canvas, texto, { format: "CODE128", displayValue: false, margin: 0, width: 2, height: 40 });
            return canvas.toDataURL('image/png');
        }

        async function rellenarPDF(esEditable) {
            const btnId = esEditable ? 'btnGenerarEditable' : 'btnGenerarRasterizado';
            const btnPresionado = document.getElementById(btnId);
            const btnEdit = document.getElementById('btnGenerarEditable');
            const btnRast = document.getElementById('btnGenerarRasterizado');

            const originalBtnText = btnPresionado.innerHTML;
            btnPresionado.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Procesando...';

            if (btnEdit) btnEdit.disabled = true;
            if (btnRast) btnRast.disabled = true;

            try {
                generarAMED();
                generarFolio();

                let pdfBytesFile;
                try {
                    pdfBytesFile = await fetch('./plantilla.pdf').then(res => res.arrayBuffer());
                } catch (e) {
                    throw new Error("No se encontró el archivo 'plantilla.pdf' en la raíz.");
                }

                const { PDFDocument } = PDFLib;
                const pdfDoc = await PDFDocument.load(pdfBytesFile);
                pdfDoc.registerFontkit(window.fontkit);

                let customFont;
                try {
                    const fontBytes = await fetch('./bahnschrift.ttf').then(res => res.arrayBuffer());
                    customFont = await pdfDoc.embedFont(fontBytes);
                } catch (error) {
                    console.warn("Aviso: No se cargó la fuente bahnschrift.ttf.");
                }

                const form = pdfDoc.getForm();
                const fechaNacimientoFormateada = formatearFechaPDF(document.getElementById('in_nacimiento').value, false);
                const fechaConsultaFormateada = formatearFechaPDF(document.getElementById('in_fecha_selector').value, true);

                const mapaCampos = {
                    'nss': 'in_nss', 'a.med': 'in_amed', 'nombre': 'in_nombre',
                    'curp': 'in_curp', 'delegacion': 'in_delegacion', 'clave': 'in_clave',
                    'unidad': 'in_unidad', 'consultorio': 'in_consultorio',
                    'turno': 'in_turno', 'folio': 'in_folio', 'direccion': 'in_direccion',
                    'medico': 'in_medico', 'universidad': 'in_universidad',
                    'cedula': 'in_cedula', 'matricula': 'in_matricula'
                };

                for (const [nombrePdf, idHtml] of Object.entries(mapaCampos)) {
                    try {
                        const campo = form.getTextField(nombrePdf);
                        const htmlEl = document.getElementById(idHtml);
                        const valor = htmlEl ? htmlEl.value.toUpperCase() : "";
                        if (campo) { campo.setText(valor); }
                    } catch (e) { }
                }

                try {
                    const campoPrescripcion = form.getTextField('prescripcion');
                    const elPrescripcion = document.getElementById('in_prescripcion');

                    if (campoPrescripcion && elPrescripcion) {
                        const widgets = campoPrescripcion.acroField.getWidgets();
                        if (widgets.length > 0) {
                            const rect = widgets[0].getRectangle();
                            const page = pdfDoc.getPages()[0];
                            const fontToUse = customFont || await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
                            const fontSize = 10;
                            let currentY = rect.y + rect.height - 12;
                            const maxWidth = rect.width - 4;

                            const lineasTexto = elPrescripcion.value.replace(/\r\n/g, '\n').split('\n');

                            function wrapText(text, maxW, font, fSize) {
                                if (!text) return [];
                                const words = text.split(' ');
                                let lines = [];
                                let currentLine = words[0];

                                for (let i = 1; i < words.length; i++) {
                                    const word = words[i];
                                    let width = 0;
                                    try { width = font.widthOfTextAtSize(currentLine + ' ' + word, fSize); }
                                    catch (e) { width = (currentLine.length + word.length + 1) * (fSize * 0.5); }

                                    if (width < maxW) { currentLine += ' ' + word; }
                                    else { lines.push(currentLine); currentLine = word; }
                                }
                                lines.push(currentLine);
                                return lines;
                            }

                            for (const parrafo of lineasTexto) {
                                if (parrafo.trim() === '') { currentY -= (fontSize + 4); continue; }
                                const isTitle = (parrafo === parrafo.toUpperCase()) && /[A-Z]/.test(parrafo);
                                const wrappedLines = wrapText(parrafo, maxWidth, fontToUse, fontSize);

                                for (const line of wrappedLines) {
                                    try {
                                        page.drawText(line, { x: rect.x + 2, y: currentY, size: fontSize, font: fontToUse, color: PDFLib.rgb(0, 0, 0) });
                                        if (isTitle) {
                                            let textWidth = 0;
                                            try { textWidth = fontToUse.widthOfTextAtSize(line, fontSize); }
                                            catch (e) { textWidth = line.length * (fontSize * 0.5); }
                                            page.drawLine({ start: { x: rect.x + 2, y: currentY - 2 }, end: { x: rect.x + 2 + textWidth, y: currentY - 2 }, thickness: 1, color: PDFLib.rgb(0, 0, 0) });
                                        }
                                    } catch (e) { }
                                    currentY -= (fontSize + 4);
                                }
                            }
                            campoPrescripcion.setText('');
                        }
                    }
                } catch (error) { console.error("Error al procesar la prescripción manualmente:", error); }

                try { form.getTextField('nacimiento').setText(fechaNacimientoFormateada); } catch (e) { }
                try { form.getTextField('fecha').setText(fechaConsultaFormateada); } catch (e) { }

                try {
                    const barcodeField = form.getField('barcode_af_image');
                    if (barcodeField) {
                        const rect = barcodeField.acroField.getWidgets()[0].getRectangle();
                        const folioActivo = document.getElementById('in_folio').value;
                        const barcodeImage = await pdfDoc.embedPng(generarBarcodeBase64(folioActivo));
                        pdfDoc.getPages()[0].drawImage(barcodeImage, { x: rect.x, y: rect.y, width: rect.width, height: rect.height });
                        form.removeField('barcode_af_image');
                    }
                } catch (error) { }

                if (customFont) form.updateFieldAppearances(customFont); else form.updateFieldAppearances();
                form.flatten();
                const finalPdfBytes = await pdfDoc.save();
                let blob;

                if (esEditable) {
                    blob = new Blob([finalPdfBytes], { type: "application/pdf" });
                } else {
                    if (!window.pdfjsLib) {
                        await new Promise((resolve, reject) => {
                            const script = document.createElement('script');
                            script.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js";
                            script.onload = resolve;
                            document.head.appendChild(script);
                        });
                        window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
                    }

                    const loadingTask = window.pdfjsLib.getDocument({ data: finalPdfBytes });
                    const pdfRenderizado = await loadingTask.promise;
                    const page = await pdfRenderizado.getPage(1);

                    const viewport = page.getViewport({ scale: 3.0 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width; canvas.height = viewport.height;
                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    const imgData = canvas.toDataURL('image/jpeg', 0.95);

                    const nuevoPdf = await PDFLib.PDFDocument.create();
                    const imgInPdf = await nuevoPdf.embedJpg(imgData);
                    const originalViewport = page.getViewport({ scale: 1.0 });
                    const nuevaPagina = nuevoPdf.addPage([originalViewport.width, originalViewport.height]);
                    nuevaPagina.drawImage(imgInPdf, { x: 0, y: 0, width: originalViewport.width, height: originalViewport.height });

                    const pdfRasterizadoBytes = await nuevoPdf.save();
                    blob = new Blob([pdfRasterizadoBytes], { type: "application/pdf" });
                }

                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                const pacNombre = document.getElementById('in_nombre').value || "Paciente";
                const sufijo = esEditable ? "" : "_Rasterizado";
                link.download = `Receta_${pacNombre.replace(/\s+/g, '_')}${sufijo}.pdf`;
                link.click();

            } catch (error) {
                console.error(error);
                alert(error.message || "Ocurrió un error inesperado al procesar el PDF.");
            } finally {
                btnPresionado.innerHTML = originalBtnText;
                if (btnEdit) btnEdit.disabled = false;
                if (btnRast) btnRast.disabled = false;
            }
        }

        // =========================================================================
        // LÓGICA VISTA MÓVIL STEPPER
        // =========================================================================
        let currentStep = 0;
        const columnsOrder = ['col-config', 'col-results', 'col-inputs'];

        window.addEventListener('resize', updateMobileView);

        function changeStep(dir) {
            currentStep += dir;
            if (currentStep < 0) currentStep = 0;
            if (currentStep > 2) currentStep = 2;
            updateMobileView();
        }

        function updateMobileView() {
            const isMobile = window.innerWidth <= 1023;
            const mobileNav = document.getElementById('mobileNav');

            if (isMobile) {
                mobileNav.style.display = 'flex';
                columnsOrder.forEach((colId, index) => {
                    document.getElementById(colId).style.display = (index === currentStep) ? 'flex' : 'none';
                });
                document.querySelectorAll('.step-dot').forEach((dot, index) => {
                    dot.classList.toggle('active', index === currentStep);
                });
                document.getElementById('btnPrevMobile').style.visibility = currentStep === 0 ? 'hidden' : 'visible';
                document.getElementById('btnNextMobile').style.visibility = currentStep === columnsOrder.length - 1 ? 'hidden' : 'visible';
            } else {
                mobileNav.style.display = 'none';
                columnsOrder.forEach(colId => {
                    document.getElementById(colId).style.display = 'flex';
                });
            }
        }
    </script>

    <!-- =========================================================================
         LÓGICA DEL TEMA LOCALSTORAGE
         ========================================================================= -->
    <script>
        const THEME_STORAGE_KEY = "eduardo_workspace_theme";
        const ADMIN_THEME_KEY = "artivo-admin-theme";

        function getCachedTheme() {
            try {
                const stored = localStorage.getItem(THEME_STORAGE_KEY) || localStorage.getItem(ADMIN_THEME_KEY);
                if (stored === 'dark' || stored === 'light') return stored;
            } catch (e) { }
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme, saveToCache = true) {
            const isDark = theme === 'dark';
            if (isDark) { document.documentElement.setAttribute('data-theme', 'dark'); }
            else { document.documentElement.removeAttribute('data-theme'); }

            const checkbox = document.getElementById('themeToggleCheckbox');
            if (checkbox) checkbox.checked = isDark;

            if (saveToCache) {
                try {
                    const val = isDark ? 'dark' : 'light';
                    localStorage.setItem(THEME_STORAGE_KEY, val);
                    localStorage.setItem(ADMIN_THEME_KEY, val);
                } catch (e) { }
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            applyTheme(getCachedTheme(), true);
            const checkbox = document.getElementById('themeToggleCheckbox');
            if (checkbox) {
                checkbox.addEventListener('change', (e) => { applyTheme(e.target.checked ? 'dark' : 'light', true); });
            }
        });

        window.addEventListener('storage', (e) => {
            if (e.key === THEME_STORAGE_KEY || e.key === ADMIN_THEME_KEY) {
                if (e.newValue === 'dark' || e.newValue === 'light') { applyTheme(e.newValue, false); }
            }
        });
    </script>

    <!-- =========================================================================
         GUARDIÁN DE SEGURIDAD DE ALTO GRADO (FIREBASE AUTH + FIRESTORE EN VIVO)
         ========================================================================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, query, limit, getDocs, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        import { FIREBASE_CONFIG } from "../../js/auth-guard.js";

        const REQUIRED_TOOL_ID = "generador_prescripciones";
        const LOGIN_URL = "../../index.html";

        function denyAndRedirect() {
            sessionStorage.removeItem('secure_app_token');
            sessionStorage.removeItem('artivo_session_user');
            window.location.replace(LOGIN_URL);
        }

        function unlockWorkspace() {
            document.body.classList.add('auth-verified');
            window.dispatchEvent(new Event('resize'));
        }

        const todayISO = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.includes("PEGA_AQUI")) {
            console.error("Falta configurar FIREBASE_CONFIG.");
            denyAndRedirect();
        } else {
            const app = initializeApp(FIREBASE_CONFIG);
            const auth = getAuth(app);
            const db = getFirestore(app);
            let unsubDoc = null;

            async function checkIsAdminByRule() {
                try { await getDocs(query(collection(db, "users"), limit(1))); return true; }
                catch (e) { return false; }
            }

            onAuthStateChanged(auth, async (user) => {
                if (unsubDoc) { unsubDoc(); unsubDoc = null; }
                if (!user || !user.email) { denyAndRedirect(); return; }

                const email = user.email.toLowerCase();
                const isAdmin = await checkIsAdminByRule();

                if (isAdmin) { unlockWorkspace(); return; }

                unsubDoc = onSnapshot(doc(db, "users", email), (snap) => {
                    if (!snap.exists()) { denyAndRedirect(); return; }
                    const userData = snap.data();
                    const isExpired = userData.state === 'active' && userData.expiry && userData.expiry < todayISO();
                    const hasToolPermission = Array.isArray(userData.tools) && userData.tools.includes(REQUIRED_TOOL_ID);
                    if (userData.state !== 'active' || isExpired || !hasToolPermission) { denyAndRedirect(); return; }
                    unlockWorkspace();
                }, () => { denyAndRedirect(); });
            });
        }
    </script>
