<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magazine Maker | Eduardo Workspace</title>

    <!-- SCRIPT DE PROTECCIÓN DE ACCESO SILENCIOSO -->
    <script>
        if (!sessionStorage.getItem('secure_app_token')) {
            document.documentElement.style.display = 'none';
            window.location.replace("../../index.html");
        }
    </script>

    <!-- Librerías PDF -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.worker.min.js';
    </script>

    <!-- Fuente Poppins e Iconos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* VARIABLES DE AURO STUDIO */
        :root {
            --primary: #6F8A3C;
            --primary-hover: #58702f;
            --primary-light: #f2f5eb;
            --bg-color: #f4f6f4;
            --surface: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border: #e2e8f0;
            --danger: #e53e3e;
            --danger-hover: #c53030;
            --danger-light: #fff5f5;
            --radius-xl: 20px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: url('../../assets/auro/bg.png');
            /* Ajusta la ruta a tu imagen de fondo si es necesario */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            flex: 1;
        }

        /* BANNER SUPERIOR */
        .top-banner {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: var(--radius-xl);
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        .top-banner h1 {
            color: var(--primary);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .top-banner p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* TARJETA PRINCIPAL */
        .card {
            background: var(--surface);
            border-radius: var(--radius-xl);
            padding: 40px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(0, 0, 0, 0.03);
            text-align: center;
        }

        /* ZONA DE DRAG & DROP */
        .file-upload {
            border: 2px dashed var(--border);
            background: var(--primary-light);
            padding: 50px 20px;
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .file-upload.dragover,
        .file-upload:hover {
            border-color: var(--primary);
            background: #e4efe0;
            transform: translateY(-2px);
        }

        .file-upload i {
            color: var(--primary);
            font-size: 40px;
        }

        .file-upload span {
            font-weight: 500;
            color: var(--text-main);
            font-size: 1.1rem;
        }

        /* BOTONES */
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(111, 138, 60, 0.2);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(111, 138, 60, 0.3);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1.5px solid var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: transparent;
            color: var(--danger);
            border: 1.5px solid var(--danger);
        }

        .btn-danger:hover {
            background: var(--danger-light);
            color: var(--danger-hover);
            border-color: var(--danger-hover);
        }

        /* SECCIÓN DE PREVISUALIZACIÓN */
        #previewSection {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid var(--border);
            text-align: left;
            animation: fadeIn 0.5s ease-out;
        }

        #previewSection h3 {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #previewContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            background: var(--bg-color);
            padding: 20px;
            border-radius: var(--radius-lg);
            border: 1px inset var(--border);
        }

        #previewContainer canvas {
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            border-radius: 4px;
            max-width: 100%;
            height: auto;
            transition: transform 0.3s;
        }

        #previewContainer canvas:hover {
            transform: scale(1.02);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Botón de regreso */
        .back-nav {
            margin-bottom: 20px;
        }

        .back-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .back-nav a:hover {
            color: var(--primary);
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="back-nav">
            <a href="../../index.html"><i class="fas fa-arrow-left"></i> Volver al Portal</a>
        </div>

        <section class="top-banner">
            <h1>Magazine Maker</h1>
            <p>Genera un archivo PDF listo para imprimir en formato de Revista / Cuadernillo</p>
        </section>

        <main class="card">

            <!-- Zona de carga de archivo -->
            <label for="inputPDF" class="file-upload" id="dragDropArea">
                <i class="fas fa-file-pdf"></i>
                <span id="fileNameText">Arrastra y suelta tu PDF aquí, o haz clic para seleccionar</span>
                <input type="file" id="inputPDF" accept="application/pdf" style="display: none;" />
            </label>

            <!-- Botones de Acción -->
            <div class="action-buttons">
                <button class="btn btn-primary" id="procesarBtn" style="display:none">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Procesar PDF
                </button>
                <a id="descargar" class="btn btn-primary" style="display:none" download="">
                    <i class="fas fa-download"></i> Descargar Revista
                </a>
                <button class="btn btn-danger" id="cargarOtroBtn" style="display:none">
                    <i class="fas fa-trash-can"></i> Descartar y Cargar Otro
                </button>
            </div>

            <!-- Previsualización -->
            <div id="previewSection" style="display: none;">
                <h3><i class="fas fa-eye" style="color: var(--primary);"></i> Vista Previa del Documento</h3>
                <div id="previewContainer" aria-live="polite"></div>
            </div>

        </main>
    </div>

    <!-- Script separado -->
    <script src="magazine.js"></script>
</body>

</html>
