<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reordenar PDF | Eduardo Workspace</title>

    <!-- SCRIPT DE PROTECCIÓN DE ACCESO SILENCIOSO -->
    <script>
        if (!sessionStorage.getItem('secure_app_token')) {
            document.documentElement.style.display = 'none';
            window.location.replace("../../index.html");
        }
    </script>

    <!-- Librerías PDF y Utilidades -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.worker.min.js';
    </script>
    <!-- Librería SortableJS (Necesaria para arrastrar y soltar) -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Fuente Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        /* VARIABLES DE AURO STUDIO */
        :root {
            --primary: #6F8A3C;
            --primary-hover: #58702f;
            --primary-light: #f2f5eb;
            --bg-color: #f4f6f4;
            --surface: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border: #e2e8f0;
            --danger: #e53e3e;
            --danger-hover: #c53030;
            --radius-xl: 20px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: url('../../assets/auro/bg.png');
            /* Ajusta si es necesario */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 20px auto;
            flex: 1;
        }

        /* BANNER Y NAVEGACIÓN */
        .back-nav {
            margin-bottom: 20px;
        }

        .back-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .back-nav a:hover {
            color: var(--primary);
        }

        .top-banner {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: var(--radius-xl);
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        .top-banner h1 {
            color: var(--primary);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .top-banner p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* TARJETA PRINCIPAL */
        .card {
            background: var(--surface);
            border-radius: var(--radius-xl);
            padding: 40px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* ZONA DE DRAG & DROP */
        .file-upload {
            border: 2px dashed var(--border);
            background: var(--primary-light);
            padding: 40px 20px;
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-align: center;
        }

        .file-upload.dragover,
        .file-upload:hover {
            border-color: var(--primary);
            background: #e4efe0;
        }

        .file-upload i {
            color: var(--primary);
            font-size: 40px;
        }

        .file-upload span {
            font-weight: 500;
            color: var(--text-main);
            font-size: 1.05rem;
        }

        /* CONTENEDOR DE PREVISUALIZACIÓN */
        #previewContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            background: var(--bg-color);
            border-radius: var(--radius-lg);
            border: 1px inset var(--border);
            padding: 25px;
            min-height: 250px;
        }

        /* ESTILOS PARA MINIATURAS (Auro Style) */
        .page-thumb {
            position: relative;
            display: flex;
            flex-direction: column;
            cursor: grab;
            user-select: none;
            background: var(--surface);
            padding: 10px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: transform 0.2s;
        }

        .page-thumb:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }

        .page-thumb canvas {
            width: 140px !important;
            height: auto !important;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: white;
        }

        .page-thumb .delete-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--danger);
            border-radius: 50%;
            width: 26px;
            height: 26px;
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            line-height: 26px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(229, 62, 62, 0.4);
            user-select: none;
            transition: var(--transition);
            z-index: 10;
        }

        .page-thumb .delete-btn:hover {
            background: var(--danger-hover);
            transform: scale(1.1);
        }

        /* Clases de SortableJS */
        .sortable-chosen {
            cursor: grabbing !important;
            box-shadow: 0 15px 30px rgba(111, 138, 60, 0.25) !important;
            transform: scale(1.05);
            border-color: var(--primary) !important;
            z-index: 1000;
        }

        .sortable-ghost {
            opacity: 0.4;
            background: var(--primary-light) !important;
            border: 2px dashed var(--primary) !important;
            border-radius: var(--radius-md);
        }

        /* BOTONES Y ESTADOS */
        .controls-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: var(--transition);
            text-decoration: none;
            min-width: 250px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(111, 138, 60, 0.2);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(111, 138, 60, 0.3);
        }

        .progress-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="back-nav">
            <a href="../../index.html"><i class="fas fa-arrow-left"></i> Volver al Portal</a>
        </div>

        <section class="top-banner">
            <h1>Reordenar PDF</h1>
            <p>Arrastra, acomoda y elimina páginas de tu PDF antes de guardarlo.</p>
        </section>

        <main class="card">

            <label class="file-upload" for="inputPDF" id="dragDropArea">
                <i class="fas fa-file-import"></i>
                <span>Arrastra o haz clic aquí para seleccionar un archivo PDF</span>
                <input type="file" id="inputPDF" accept="application/pdf" style="display:none;" />
            </label>

            <!-- Zona de reordenamiento -->
            <div id="previewContainer">
                <div style="color: var(--text-muted); text-align: center; margin: auto; font-size: 0.9rem;">
                    Las páginas aparecerán aquí para que las ordenes.
                </div>
            </div>

            <!-- Controles finales -->
            <div class="controls-section">
                <button id="downloadBtn" class="btn btn-primary" disabled>
                    <i class="fas fa-save"></i> Descargar PDF Reordenado
                </button>
                <p class="progress-text" id="progressText"></p>
            </div>

        </main>

    </div>

    <!-- Script de lógica -->
    <script src="pdf_reorder.js"></script>
</body>

</html>
